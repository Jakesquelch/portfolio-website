<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Graphite tile matching the site's dark background token. -->
  <rect width="32" height="32" rx="7" fill="#161618"/>
  <!-- Monospace-style "J": top crossbar into a stem and hook. The crossbar is
       what makes it read as mono rather than handwritten, a nod to Geist Mono
       carrying every label on the site. Drawn as a stroked path rather than a
       text element because SVG favicons can't load webfonts, so text would
       render with whatever face each machine happens to have.
       Note: no double hyphens in this file. XML forbids them inside comments
       and a malformed icon fails silently as a missing favicon. -->
  <path d="M13 8h8.5m0 0v8.5a5.25 5.25 0 0 1-10.5 0"
        fill="none" stroke="#a78bfa" stroke-width="3.25"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
